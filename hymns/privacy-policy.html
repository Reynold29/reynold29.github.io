<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - CSI Hymns</title>
    <!-- Redirect to the Google Sites Privacy Policy -->
    <meta http-equiv="refresh" content="0; url=https://sites.google.com/view/csi-hymns-privacy-policy/home">
    <script>
        window.location.href = "https://sites.google.com/view/csi-hymns-privacy-policy/home";
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f9;
        }
        .container {
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <p>Redirecting to Privacy Policy...</p>
        <p>If you are not redirected automatically, <a href="https://sites.google.com/view/csi-hymns-privacy-policy/home">click here</a>.</p>
    </div>
</body>
</html>
